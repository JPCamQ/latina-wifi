<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Latina WiFi</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0072bc;
            --secondary: #f37021;
            --dark: #1e272e;
            --light: #f5f6fa;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            border: none;
            border-radius: 24px;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .login-header {
            background: linear-gradient(135deg, var(--primary) 0%, #005a9c 100%);
            color: white;
            padding: 35px 25px;
            text-align: center;
            position: relative;
        }
        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 15px;
            background-color: white;
            clip-path: ellipse(60% 100% at 50% 100%);
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #e1e8ed;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 114, 188, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #005a9c 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 114, 188, 0.3);
        }
        .text-secondary-color {
            color: var(--secondary);
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            opacity: 0.8;
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover {
            opacity: 1;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <a href="/" class="back-btn"><i class="fas fa-arrow-left fa-lg"></i></a>
            <img src="/images/logo.png" alt="Latina WiFi" class="mb-3" style="height: 55px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.15));">
            <h1 class="h4 fw-bold mb-1">Portal de Clientes</h1>
            <p class="small mb-0 opacity-75">Inicia sesión para gestionar tus accesos y reportes rápidos</p>
        </div>
        <div class="p-4 pt-5">
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold small">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;"><i class="fas fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0" style="border-radius: 0 12px 12px 0;" id="email" required placeholder="correo@ejemplo.com">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-bold small">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" style="border-radius: 0 12px 12px 0;" id="password" required placeholder="••••••••">
                    </div>
                </div>

                <div id="alertMsg" class="alert alert-danger p-2 small text-center" style="display: none;"></div>

                <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                    <i class="fas fa-sign-in-alt me-2"></i>INICIAR SESIÓN
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted small mb-0">¿No tienes una cuenta aún?</p>
                <a href="/register" class="fw-bold text-decoration-none" style="color: var(--secondary);">Regístrate Aquí</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const alertMsg = document.getElementById('alertMsg');
        const submitBtn = document.getElementById('submitBtn');

        // Verificar si ya tiene sesión activa
        if (localStorage.getItem('customer_token')) {
            window.location.href = '/portal';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertMsg.style.display = 'none';
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>INGRESANDO...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/customers/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();

                if (response.ok && result.success) {
                    // Guardar sesión de cliente
                    localStorage.setItem('customer_token', result.token);
                    localStorage.setItem('customer_data', JSON.stringify(result.customer));
                    
                    // Redirigir al portal
                    window.location.href = '/portal';
                } else {
                    alertMsg.textContent = result.error || 'Credenciales de acceso incorrectas.';
                    alertMsg.style.display = 'block';
                }
            } catch (err) {
                alertMsg.textContent = 'Error de conexión con el servidor.';
                alertMsg.style.display = 'block';
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>INICIAR SESIÓN';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
