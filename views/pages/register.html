<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente - Latina WiFi</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0072bc;
            --secondary: #f37021;
            --dark: #1e272e;
            --light: #f5f6fa;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-card {
            border: none;
            border-radius: 24px;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }
        .register-header {
            background: linear-gradient(135deg, var(--primary) 0%, #005a9c 100%);
            color: white;
            padding: 25px 25px 30px 25px;
            text-align: center;
            position: relative;
        }
        .register-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 15px;
            background-color: white;
            clip-path: ellipse(60% 100% at 50% 100%);
        }
        .form-control {
            border-radius: 12px;
            padding: 10px 16px;
            border: 1px solid #e1e8ed;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 114, 188, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #005a9c 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 114, 188, 0.3);
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            opacity: 0.8;
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover {
            opacity: 1;
            color: white;
        }
        .scrollable-body {
            overflow-y: auto;
            padding: 30px 24px;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="register-header">
            <a href="/login" class="back-btn"><i class="fas fa-arrow-left fa-lg"></i></a>
            <h1 class="h4 fw-bold mb-1">Crear Cuenta</h1>
            <p class="small mb-0 opacity-75">Regístrate para reportar pagos al instante y ver tus PINs</p>
        </div>
        <div class="scrollable-body">
            <form id="registerForm">
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold small">Nombre y Apellido</label>
                    <input type="text" class="form-control" id="nombre" required placeholder="Ej: Juan Pérez">
                </div>

                <div class="mb-3">
                    <label for="cedula" class="form-label fw-bold small">Cédula de Identidad</label>
                    <input type="text" class="form-control" id="cedula" required placeholder="Ej: V-12345678">
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label fw-bold small">Número de Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" required placeholder="Ej: 0412-1234567">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold small">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" required placeholder="correo@ejemplo.com">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-bold small">Contraseña</label>
                    <input type="password" class="form-control" id="password" required placeholder="Crea tu contraseña">
                </div>

                <div id="alertMsg" class="alert alert-danger p-2 small text-center" style="display: none;"></div>

                <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                    <i class="fas fa-user-plus me-2"></i>REGISTRARME E INGRESAR
                </button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted small mb-0">¿Ya tienes cuenta?</p>
                <a href="/login" class="fw-bold text-decoration-none" style="color: var(--secondary);">Inicia Sesión</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const alertMsg = document.getElementById('alertMsg');
        const submitBtn = document.getElementById('submitBtn');
        const cedulaInput = document.getElementById('cedula');

        // Forzar cédula a mayúsculas
        cedulaInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertMsg.style.display = 'none';

            const nombre = document.getElementById('nombre').value.trim();
            const cedula = cedulaInput.value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>CREANDO CUENTA...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/customers/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nombre, cedula, email, telefono, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Guardar sesión y redirigir
                    localStorage.setItem('customer_token', result.token);
                    localStorage.setItem('customer_data', JSON.stringify(result.customer));
                    window.location.href = '/portal';
                } else {
                    alertMsg.textContent = result.error || 'Error al intentar registrarse.';
                    alertMsg.style.display = 'block';
                }
            } catch (err) {
                alertMsg.textContent = 'Error de conexión con el servidor.';
                alertMsg.style.display = 'block';
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-user-plus me-2"></i>REGISTRARME E INGRESAR';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
