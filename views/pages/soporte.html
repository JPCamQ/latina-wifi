<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico - Latina WiFi</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0072bc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Latina WiFi">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0072bc;
            --secondary: #f37021;
            --dark: #1e272e;
            --light: #f5f6fa;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            padding-bottom: 80px;
        }
        .header-section {
            background: linear-gradient(135deg, var(--primary) 0%, #005a9c 100%);
            color: white;
            padding: 25px 0;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(0, 114, 188, 0.15);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .required-field::after {
            content: " *";
            color: #dc3545;
        }
        .card-details {
            border: none;
            border-radius: 16px;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        /* Menú inferior para móviles */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: white;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1030;
            border-radius: 15px 15px 0 0;
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.75rem;
            transition: all 0.2s;
            width: 25%;
        }
        .bottom-nav-item i {
            font-size: 1.4rem;
            margin-bottom: 3px;
        }
        .bottom-nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }
        .bottom-nav-item.action-btn {
            color: white;
            background: linear-gradient(135deg, var(--secondary) 0%, #e05e10 100%);
            border-radius: 50%;
            width: 54px;
            height: 54px;
            margin-top: -25px;
            box-shadow: 0 5px 10px rgba(243, 112, 33, 0.3);
            border: 3px solid white;
        }
        .bottom-nav-item.action-btn i {
            margin-bottom: 0;
            font-size: 1.3rem;
        }
        .bottom-nav-item.action-btn span {
            display: none;
        }
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            border: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header-section text-center mb-4">
        <div class="container px-3">
            <h1 class="h4 fw-bold mb-1"><i class="fas fa-headset me-2"></i>Soporte Técnico</h1>
            <p class="small mb-0 opacity-75">Reporta fallas, lentitud o problemas con tu PIN</p>
        </div>
    </header>

    <div class="container py-2">
        <!-- Botón WhatsApp rápido -->
        <a href="https://wa.me/584243594340" target="_blank" class="btn whatsapp-btn btn-lg w-100 rounded-4 mb-4 py-3 shadow-sm d-flex align-items-center justify-content-center">
            <i class="fab fa-whatsapp fa-lg me-2"></i>Chatear con un Asesor por WhatsApp
        </a>

        <!-- Formulario -->
        <div class="card card-details p-3 mb-4">
            <h2 class="h6 fw-bold text-primary mb-3"><i class="fas fa-file-signature me-1"></i>Abrir Ticket de Soporte</h2>
            
            <form id="ticketForm">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="nombre" class="form-label required-field">Nombre y Apellido</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">
                    </div>

                    <div class="col-12">
                        <label for="telefono" class="form-label required-field">Teléfono Móvil</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" required placeholder="Ej: 0414-1234567">
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label required-field">Correo Electrónico (Para recibir notificaciones)</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="Ej: correo@ejemplo.com">
                    </div>

                    <div class="col-12">
                        <label for="zona_wifi" class="form-label required-field">Zona de Cobertura (Ubicación de la falla)</label>
                        <select class="form-select" id="zona_wifi" name="zona_wifi" required>
                            <option value="">Seleccione Zona...</option>
                            <option value="Casco Central">Casco Central</option>
                            <option value="La Paraita">La Paraita</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="asunto" class="form-label required-field">Asunto / Tipo de Falla</label>
                        <select class="form-select" id="asunto" name="asunto" required>
                            <option value="">Seleccione Asunto...</option>
                            <option value="Falla de Conexión">Falla de Conexión (No conecta)</option>
                            <option value="Velocidad Lenta">Velocidad Lenta</option>
                            <option value="Problema con PIN">Problema con PIN / Voucher</option>
                            <option value="Otro">Otro problema técnico</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="mensaje" class="form-label required-field">Detalle del Reporte</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required placeholder="Describa el inconveniente detalladamente (ej: dirección exacta, desde cuándo ocurre la falla, etc.)."></textarea>
                    </div>

                    <!-- Botón de Envío -->
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold rounded-3">
                            <i class="fas fa-ticket-alt me-2"></i>ABRIR TICKET DE SOPORTE
                        </button>
                    </div>
                </div>
            </form>
            <div id="alertContainer" class="mt-3"></div>
        </div>
    </div>

    <!-- Menú Inferior Móvil -->
    <div class="bottom-nav">
        <a href="/" class="bottom-nav-item">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </a>
        <a href="/soporte/renovar" class="bottom-nav-item action-btn">
            <i class="fas fa-plus"></i>
        </a>
        <a href="/soporte" class="bottom-nav-item active">
            <i class="fas fa-headset"></i>
            <span>Soporte</span>
        </a>
        <a href="/portal" class="bottom-nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Mi Cuenta</span>
        </a>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('ticketForm');
        const alertContainer = document.getElementById('alertContainer');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalHTML = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>ENVIANDO TICKET...';
            submitBtn.disabled = true;

            const payload = {
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                email: document.getElementById('email').value,
                zona_wifi: document.getElementById('zona_wifi').value,
                asunto: document.getElementById('asunto').value,
                mensaje: document.getElementById('mensaje').value
            };

            try {
                const response = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (response.ok) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <strong>¡Reporte enviado con éxito!</strong><br>
                            ${result.message}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    `;
                    form.reset();
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            <strong>Error:</strong> ${result.error || 'No se pudo crear el ticket.'}
                        </div>
                    `;
                }
            } catch (err) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <strong>Error:</strong> Sin conexión con el servidor.
                    </div>
                `;
            } finally {
                submitBtn.innerHTML = originalHTML;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
